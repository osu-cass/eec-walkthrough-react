services:
  # MariaDB 10.11 database to match production CentOS environment
  database:
    image: mariadb:10.11
    container_name: eec-walkthrough-db
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MARIADB_DATABASE_FILE: /run/secrets/mysql_db_name
      MARIADB_USER_FILE: /run/secrets/mysql_user
      MARIADB_PASSWORD_FILE: /run/secrets/mysql_password
    ports:
      - "3306:3306"
    volumes:
      # Initialize database with new schema (includes latest field additions)
      - ./services/database/db-init-new.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Custom MariaDB configuration
      - ./docker/database/my.cnf:/etc/mysql/mariadb.conf.d/99-custom.cnf:ro
      # Persistent database storage
      - db_data:/var/lib/mysql
    networks:
      - eec-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    secrets:
      - mysql_root_password
      - mysql_db_name
      - mysql_user
      - mysql_password

  # phpMyAdmin web interface for database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: eec-walkthrough-phpmyadmin
    environment:
      PMA_USER: walkthrough
      PMA_PORT: 3306
      PMA_HOST_FILE: /run/secrets/mysql_db_host
      PMA_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    ports:
      - "8080:80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - eec-network
    restart: unless-stopped
    secrets:
      - mysql_password
      - mysql_root_password
      - mysql_db_host

  # Node.js application
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        REACT_APP_API_HOST: ${REACT_APP_API_HOST}
    container_name: eec-walkthrough-app
    environment:
      API_PORT: ${API_PORT}
      FILE_PORT: ${FILE_PORT}
      SQL_PORT_FILE: /run/secrets/mysql_port
      SQL_DB_NAME_FILE: /run/secrets/mysql_db_name
      SQL_HOST_FILE: /run/secrets/mysql_db_host
      SQL_PASSWORD_FILE: /run/secrets/mysql_password
      SQL_USER_FILE: /run/secrets/mysql_user
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      NODE_ENV: ${NODE_ENV:? error - NODE_ENV is not set}
    ports:
      - "${API_PORT}:${API_PORT}"  # API port via env variable
      - "${FILE_PORT}:${FILE_PORT}"  # File serving port via env variable
    depends_on:
      database:
        condition: service_healthy
    networks:
      - eec-network
    restart: unless-stopped
    volumes:
      # Persistent uploads storage
      - uploads_data:/app/client/files/uploads
      - public_uploads_data:/app/client/public/uploads
    secrets:
      - mysql_root_password
      - mysql_db_name
      - mysql_user
      - mysql_password
      - mysql_port
      - mysql_db_host
      - jwt_secret_key

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  mysql_db_name:
    file: ./secrets/mysql_db_name.txt
  mysql_user:
    file: ./secrets/mysql_user.txt
  mysql_password:
    file: ./secrets/mysql_password.txt
  mysql_port:
    file: ./secrets/mysql_port.txt
  mysql_db_host:
    file: ./secrets/mysql_db_host.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt

# Named volumes for persistent data
volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
  public_uploads_data:
    driver: local

# Network for service communication
networks:
  eec-network:
    driver: bridge
