# Development overrides for docker-compose.yml
services:
  app:
    # Use development Dockerfile
    build:
      context: .
      dockerfile: docker/app/Dockerfile.dev
    # Mount source code for live development
    volumes:
      - .:/app:cached
      - /app/node_modules
      - /app/client/node_modules
      - uploads_data:/app/client/files/uploads
      - public_uploads_data:/app/client/public/uploads
    environment:
      - NODE_ENV=development
      - DISABLE_ESLINT_PLUGIN=true
      # Include secrets paths (these get merged with base secrets config)
      - SQL_PORT_FILE=/run/secrets/mysql_port
      - SQL_DB_NAME_FILE=/run/secrets/mysql_db_name
      - SQL_HOST_FILE=/run/secrets/mysql_db_host
      - SQL_PASSWORD_FILE=/run/secrets/mysql_password
      - SQL_USER_FILE=/run/secrets/mysql_user
      - API_PORT=${API_PORT}
      - FILE_PORT=${FILE_PORT}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    ports:
      - "9229:9229"  # Node.js debugger
      - "3000:3000"  # React dev server
    # Override command to run in development mode
    command: npm run dev:debug
    # Remove restart policy for development
    restart: "no"