---
name: Create and publish a Docker image

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  schedule:
    - cron: '45 18 * * 3'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Scheduled runs rebuild every published branch image; push/PR runs
        # only build the triggering ref.
        branch: ${{ github.event_name == 'schedule' && fromJSON('["dev", "main"]') || fromJSON(format('["{0}"]', github.ref_name)) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && matrix.branch || '' }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and export Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app/Dockerfile
          tags: Energy-Efficency-Center/eec-walkthrough-react:test
          # Scheduled runs pull the latest base image and rebuild from
          # scratch, repopulating the cache with fresh layers.
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ matrix.branch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.branch }}
      - name: Log in to the Container registry
        if: contains(fromJSON('["push", "schedule"]'), github.event_name)
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        if: contains(fromJSON('["push", "schedule"]'), github.event_name)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ matrix.branch }},enable=${{ github.event_name == 'schedule' }}
      - name: Build and push Docker image
        if: contains(fromJSON('["push", "schedule"]'), github.event_name)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.branch }}
