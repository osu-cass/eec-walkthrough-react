name: Client tests

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  vitest:
    name: vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
