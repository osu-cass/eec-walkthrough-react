---
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /client
    schedule:
      interval: weekly    groups:
      npm-dependencies:
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /docker/app
    schedule:
      interval: weekly    groups:
      docker:
        patterns:
          - "*"
